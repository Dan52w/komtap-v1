[package]
name = "komtap"
version = "0.1.0"
description = "Komtap - Gestión de tienda de ropa (proveedores, inventario, ventas y contabilidad)"
authors = ["you"]
edition = "2021"

[lib]
name = "komtap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
bcrypt = "0.15"
