[package]
name = "komtap"
version = "0.1.0"
description = "Komtap - Gestión de proveedores, inventario, ventas y contabilidad"
authors = ["you"]
edition = "2021"
default-run = "komtap"

[lib]
name = "komtap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
bcrypt = "0.15"
hmac = "0.12"
sha2 = "0.10"
base32 = "0.5"
hex = "0.4"
rand = "0.8"
